<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Quantumlight</title><style>body{margin:0;background:radial-gradient(circle at 50% 10%,#24205c,#070914 55%);color:#fff;font:16px system-ui}main{max-width:900px;margin:auto;padding:32px}.c{background:#10152bdb;border:1px solid #47427b;border-radius:20px;padding:20px;margin:16px 0}button{background:#a06cff;color:#fff;border:0;border-radius:12px;padding:12px}input{width:70%;padding:12px;border-radius:10px;border:1px solid #504b82;background:#080b18;color:#fff}</style>
<style id="chatgpt-inspired-ui">

</head><body><main><h1>AI Quantumlight</h1><p>Quantumlight KI Workspace</p><div class="c"><h2>Light Chat</h2><p id="o">Das Quantumlight-System ist bereit.</p><input id="q" placeholder="Frage…"><button onclick="go()">Senden</button></div><div class="c"><h2>Core</h2><p>KI-Chat · Quantumlight UI · Backend-Anbindung · sichere Konfiguration</p></div></main><script>function go(){const q=document.getElementById('q').value.trim();if(q)document.getElementById('o').textContent='Du: '+q+'\nAI Quantumlight: Anfrage empfangen.'}</script></body></html>
